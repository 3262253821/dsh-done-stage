# ============================================================================
# dsh-done-badge - DSH bundle patch
# ============================================================================
# 插件挂载声明: DSH 启动时按 bundle 层叠加载本插件 patch,
# 将其插入当前 profile 的配置树。
# 安装(把 <插件目录> 换成你克隆到本地的这个仓库的绝对路径; 路径里不要有空格):
#   dsh plugin --profile desktop add link:<插件目录>
# 没有 dsh 命令时也可以直接改 profile 装配(见 README「安装」一节)。
# ============================================================================

- insert:
    - id: dsh-done-badge
      name: dsh-done-badge
      config:
        # Windows 通知开关: away(默认, 只在离开窗口时弹) | always(每次都弹) | off(关闭, 只保留角标)
        toast: away
